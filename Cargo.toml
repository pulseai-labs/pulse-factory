[workspace]
resolver = "3"
members = [
    "crates/pf-engine",
    "crates/pf-store-sqlite",
    "crates/pf-workflow",
    "crates/pf-rules",
    "crates/pf-adapter-omp",
    "crates/pf-adapter-claude",
    "crates/pf-adapter-fake",
    "crates/pf-forge-github",
    "crates/pf-forge-bare",
    "crates/pf-ipc",
    "crates/pf-api",
    "crates/pf-client",
    "crates/pulse-factory",
]
# The Mac app has its own cargo workspace (ADR-0013). No build on draco-desk compiles it.
exclude = ["apps/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", default-features = false }
rusqlite = { version = "=0.41.0", features = ["bundled"] }
yaml-rust2 = "=0.13.0"
portable-pty = "=0.9.0"
clap = { version = "=4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "derive"] }
# the network API (ADR-0012): HTTP, TLS with the `ring` provider only (no aws-lc-rs, so no cmake
# build), a self-signed certificate, and the TypeScript types for the clients
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws"] }
hyper = { version = "=1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio", "service"] }
http-body-util = "=0.1.5"
bytes = "=1.12.1"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }
# the chat stream (r1.s3.w3): axum's `ws` feature needs it, and the stream reader and the tests use its
# synchronous client (`tungstenite`, re-exported). Pinned with `=`; ADR-0008 records the first-use check.
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["handshake"] }
# the chat stream of the pinned client (r1.s3.w4): `StreamExt` and `SinkExt` on the WebSocket. Already in the
# lock through axum and `tokio-tungstenite`; ADR-0008 records the first-use check.
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
ts-rs = { version = "=12.0.1", default-features = false, features = ["serde-compat"] }
# the Keychain of the Mac app (r1.s2.w4); `pf-client` takes it on macOS only
security-framework = "=3.7.0"
# dev-only test crates
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
proptest = "1.11.0"
tempfile = "3"
