[workspace]
resolver = "3"
members = [
    "crates/pf-engine",
    "crates/pf-store-sqlite",
    "crates/pf-workflow",
    "crates/pf-rules",
    "crates/pf-adapter-omp",
    "crates/pf-adapter-fake",
    "crates/pf-forge-github",
    "crates/pf-forge-bare",
    "crates/pf-ipc",
    "crates/pulse-factory",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", default-features = false }
rusqlite = { version = "=0.41.0", features = ["bundled"] }
yaml-rust2 = "=0.13.0"
portable-pty = "=0.9.0"
clap = { version = "=4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "derive"] }
# dev-only test crates
proptest = "1.11.0"
tempfile = "3"
