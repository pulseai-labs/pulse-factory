# The ossify-spine workflow: arm a spine, and its item PRs merge into the spine branch with no
# operator present. When every item is merged, a spine-close seat opens the spine PR. That PR
# merges into the base branch only on the claim holder's ack (`pulse-factory ack`). The run ends
# when the method records the spine as closed. Every path is a placeholder. The arm step supplies
# the parameters.
#
# An answer reaches the seat that needs it through three hooks (`on_answer`), all POSIX `sh`
# scripts in `scripts/`. The controller runs a hook when an answer resumes a unit, before the
# unit runs again. The scripts call no method tool.
#   gaps.json       `clarify.sh` appends the answer to the work item handoff's `## Clarifications`.
#   stop file       `rule.sh` appends the ruling to {run.dir}/out/{unit.id}/rulings.md, which every
#                   brief tells a seat to read first, and renames the stop file.
#   correction.txt  `rule.sh` does the same for the close stage's correction packet: it quotes the
#                   packet in the rulings file and renames the packet.
# A park with no file has no hook: the review cap park (`<stage>: <to> cap <max> reached`) ends its
# stage `done`, so no seat of that stage is left to read an answer. `clear` is its way on.
version: 1
name: ossify-spine

# What `arm` must supply.
#   spine         the spine ID
#   spine_branch  the branch the item PRs merge into
#   spine_dir     the directory that holds the spine's specs and reports
#   method_root   the directory where the method's tool runs (it holds the method's state)
#   repo          the local path of the repository the spine builds (a `git -C` path)
#   forge_repo    the repository on the forge, such as `owner/name`; `arm` reads it from the forge
#   worktree_root the directory that holds the item worktrees
#   state_file    the method's state file
#   oss           the method's command-line tool
#   briefs        the directory that holds the pinned briefs; `arm` sets it to the run's own copy
#   base_branch   the branch the spine PR merges into (the skill reads it from the method's state)
params: [spine, spine_branch, spine_dir, method_root, repo, forge_repo, worktree_root, state_file, oss, briefs, base_branch]

plugins:
  - name: ossify
    # 1.30.0: the first close with `--verdict`; it reads a caller's verdict, `agent` key included.
    min_version: 1.30.0

# Cheap models. Every role runs in the OMP runtime.
roles:
  lane:
    runtime: omp
    model: zai/glm-5.3-flash
    rules: rules/lane.yaml
  implementer:
    runtime: omp
    model: zai/glm-5.3-flash
    rules: rules/implementer.yaml
  verifier:
    runtime: omp
    model: zai/glm-5.3-flash
    rules: rules/verifier.yaml
  close:
    runtime: omp
    model: zai/glm-5.3-flash
    rules: rules/close.yaml
  # The item PR reviewer. It reads the PR and writes one review file. The operator ruled the
  # model (G10): zai/glm-5.3 now, DeepSeek V4.1 Flash when the Z.AI quota ends.
  reviewer:
    runtime: omp
    model: zai/glm-5.3
    rules: rules/reviewer.yaml

settings:
  model_sessions: 2
  cold_builds: 1

# `arm` runs this to learn how many items the spine has. It prints one whole number.
plan_check:
  - jq
  - -r
  - --arg
  - s
  - "{param.spine}"
  - "[.work_items[] | select(.spine == $s)] | length"
  - "{param.state_file}"

# A working directory that a seat's record names must lie under one of these.
roots: ["{param.worktree_root}"]

# The queue and `rounds.done` are the lane's files. They live under the lane's own directory, so a
# seat writes only in its own unit's directory (`out/<unit>`; a lane repeat also owns `out/lane`).
unit_sources:
  - dir: "{run.dir}/out/lane/queue"
    track: item
    vars: [worktree_path, branch, handoff_path, base_sha]

# The lane seat fills the queue. It runs again after each group of items is done.
seeds:
  - id: lane
    group: lane
    order: 1
    track: lane
    vars: {}
    repeat:
      when_units_done: item
      until_file: "{run.dir}/out/lane/rounds.done"
      max: 12
  # The spine close starts once the lane wrote `out/lane/rounds.done` and every item is done. It runs
  # once.
  - id: spine
    group: spine
    order: 2
    track: spine
    vars: {}
    start_when:
      file: "{run.dir}/out/lane/rounds.done"
      units_done: item

tracks:
  lane:
    stages:
      - name: lane
        role: lane
        brief: [briefs/common.md, briefs/lane.md]
        message: >-
          Read {param.briefs}/common.md, then {param.briefs}/lane.md, and follow them.
          Spine: {param.spine}. Queue directory: {run.dir}/out/lane/queue.
          OUT: {run.dir}/out/{unit.id}. Lane done file: {run.dir}/out/{unit.id}/lane.done.
          Rounds done file: {run.dir}/out/lane/rounds.done. Stop file: {run.dir}/out/{unit.id}/stop.
          Rulings: {run.dir}/out/{unit.id}/rulings.md.
          Decisions file: {run.dir}/out/{unit.id}/decisions.md.
        cwd: "{param.method_root}"
        slots: [session]
        # The queue directory exists before any lane repeat writes to it.
        before:
          - [mkdir, -p, "{run.dir}/out/{unit.id}"]
          - [mkdir, -p, "{run.dir}/out/lane/queue"]
        stop_file:
          file: "{run.dir}/out/{unit.id}/stop"
          on_answer:
            - - sh
              - "{run.package}/scripts/rule.sh"
              - "{run.dir}/out/{unit.id}/rulings.md"
              - "{run.dir}/out/{unit.id}/stop"
              - "{answer.file}"
              - "{answer.request}"
              - "{answer.generation}"
              - lane
        stall_minutes: 15
        first_turn_seconds: 180
        skills: [run-spine]
        settings:
          env.SPINE_STOP_FILE: "{run.dir}/out/{unit.id}/stop"
          env.SPINE_DECISIONS: "{run.dir}/out/{unit.id}/decisions.md"
          report_dir: "{param.spine_dir}"
          decisions_file: "{run.dir}/out/{unit.id}/decisions.md"
        done:
          - file: "{run.dir}/out/{unit.id}/lane.done"

  item:
    stages:
      - name: implement
        role: implementer
        brief: [briefs/common.md, briefs/implement.md]
        message: >-
          Read {param.briefs}/common.md, then {param.briefs}/implement.md, and follow them.
          Work item: {unit.id}. Handoff: {unit.vars.handoff_path}.
          Report: {param.spine_dir}/work-{unit.id}/report.md.
          OUT: {run.dir}/out/{unit.id}. Gaps file: {run.dir}/out/{unit.id}/gaps.json.
          Stop file: {run.dir}/out/{unit.id}/stop.
          Rulings: {run.dir}/out/{unit.id}/rulings.md.
          Decisions file: {run.dir}/out/{unit.id}/decisions.md.
        cwd: "{unit.vars.worktree_path}"
        slots: [session, build]
        # `before` only reads the dispatch count. The count itself is written after the first turn.
        before:
          - [mkdir, -p, "{run.dir}/out/{unit.id}"]
          - - jq
            - -e
            - --arg
            - w
            - "{unit.id}"
            - "any(.work_items[]; .id == $w and (.dispatches // 0) < 3)"
            - "{param.state_file}"
          - [rm, -f, "{run.dir}/out/{unit.id}/gaps.json"]
        after_first_turn:
          - [env, -C, "{param.method_root}", "{param.oss}", work_item_dispatched, "{unit.id}"]
        stop_file:
          file: "{run.dir}/out/{unit.id}/stop"
          on_answer:
            - - sh
              - "{run.package}/scripts/rule.sh"
              - "{run.dir}/out/{unit.id}/rulings.md"
              - "{run.dir}/out/{unit.id}/stop"
              - "{answer.file}"
              - "{answer.request}"
              - "{answer.generation}"
              - implement
        stall_minutes: 20
        first_turn_seconds: 180
        skills: [work-item]
        settings:
          env.SPINE_STOP_FILE: "{run.dir}/out/{unit.id}/stop"
          env.SPINE_DECISIONS: "{run.dir}/out/{unit.id}/decisions.md"
          report_dir: "{param.spine_dir}/work-{unit.id}"
          worktree: "{unit.vars.worktree_path}"
          own_branch: "{unit.vars.branch}"
          decisions_file: "{run.dir}/out/{unit.id}/decisions.md"
        done:
          - file: "{param.spine_dir}/work-{unit.id}/report.md"
        park_on:
          - file: "{run.dir}/out/{unit.id}/gaps.json"
            reason: "gaps surfaced for {unit.id}: answer them with `pulse-factory answer`"
            # The answer goes into the handoff's `## Clarifications`, which ossify reads again on
            # every dispatch. The unit then runs `implement` again. `before` counts that dispatch.
            on_answer:
              - - sh
                - "{run.package}/scripts/clarify.sh"
                - "{unit.vars.handoff_path}"
                - "{request.body_file}"
                - "{answer.file}"
                - "{answer.request}"
                - "{answer.generation}"
                - "{param.spine_dir}"

      - name: verify
        role: verifier
        brief: [briefs/common.md, briefs/verify.md]
        message: >-
          Read {param.briefs}/common.md, then {param.briefs}/verify.md, and follow them.
          Work item: {unit.id}. Handoff: {unit.vars.handoff_path}.
          Report: {param.spine_dir}/work-{unit.id}/report.md.
          Worktree: {unit.vars.worktree_path}. Base SHA: {unit.vars.base_sha}.
          Verdict file: {run.dir}/out/{unit.id}/verdict.json.
          OUT: {run.dir}/out/{unit.id}. Stop file: {run.dir}/out/{unit.id}/stop.
          Rulings: {run.dir}/out/{unit.id}/rulings.md.
        cwd: "{unit.vars.worktree_path}"
        slots: [session, build]
        before:
          - [mkdir, -p, "{run.dir}/out/{unit.id}"]
          - [rm, -f, "{run.dir}/out/{unit.id}/verdict.json"]
        stop_file:
          file: "{run.dir}/out/{unit.id}/stop"
          on_answer:
            - - sh
              - "{run.package}/scripts/rule.sh"
              - "{run.dir}/out/{unit.id}/rulings.md"
              - "{run.dir}/out/{unit.id}/stop"
              - "{answer.file}"
              - "{answer.request}"
              - "{answer.generation}"
              - verify
        stall_minutes: 20
        first_turn_seconds: 180
        skills: [close]
        settings:
          env.SPINE_STOP_FILE: "{run.dir}/out/{unit.id}/stop"
          env.OSSIFY_VERIFY_WORKTREE: "{unit.vars.worktree_path}"
          report_dir: "{param.spine_dir}/work-{unit.id}"
          worktree: "{unit.vars.worktree_path}"
          own_branch: "{unit.vars.branch}"
        done:
          - file: "{run.dir}/out/{unit.id}/verdict.json"

      - name: close
        role: close
        brief: [briefs/common.md, briefs/close.md]
        message: >-
          Read {param.briefs}/common.md, then {param.briefs}/close.md, and follow them.
          Work item: {unit.id}. Handoff: {unit.vars.handoff_path}.
          Worktree: {unit.vars.worktree_path}. Branch: {unit.vars.branch}.
          Base SHA: {unit.vars.base_sha}.
          Verdict file: {run.dir}/out/{unit.id}/verdict.json.
          Correction packet: {run.dir}/out/{unit.id}/correction.txt.
          OUT: {run.dir}/out/{unit.id}. Stop file: {run.dir}/out/{unit.id}/stop.
          Rulings: {run.dir}/out/{unit.id}/rulings.md.
          Decisions file: {run.dir}/out/{unit.id}/decisions.md.
        cwd: "{param.method_root}"
        slots: [session]
        # ossify's PR-mode item close (work-item-close.md §4a) needs the spine branch on `origin`,
        # and pushes it itself when `ls-remote` finds it absent. This seat's own branch is the work
        # branch, so its rules deny that push. The controller puts the spine branch on `origin`
        # before this stage launches, when `origin` lacks it, so no seat pushes a branch that is
        # not its own.
        base_push:
          dir: "{param.repo}"
          branch: "{param.spine_branch}"
        before:
          - [mkdir, -p, "{run.dir}/out/{unit.id}"]
        stop_file:
          file: "{run.dir}/out/{unit.id}/stop"
          on_answer:
            - - sh
              - "{run.package}/scripts/rule.sh"
              - "{run.dir}/out/{unit.id}/rulings.md"
              - "{run.dir}/out/{unit.id}/stop"
              - "{answer.file}"
              - "{answer.request}"
              - "{answer.generation}"
              - close
        stall_minutes: 20
        first_turn_seconds: 180
        skills: [close]
        settings:
          env.SPINE_STOP_FILE: "{run.dir}/out/{unit.id}/stop"
          env.SPINE_DECISIONS: "{run.dir}/out/{unit.id}/decisions.md"
          push_dir: "{unit.vars.worktree_path}"
          push_branch: "{unit.vars.branch}"
          report_dir: "{param.spine_dir}/work-{unit.id}"
          worktree: "{unit.vars.worktree_path}"
          own_branch: "{unit.vars.branch}"
          decisions_file: "{run.dir}/out/{unit.id}/decisions.md"
        done:
          - pr:
              argv:
                - env
                - -C
                - "{param.method_root}"
                - "{param.oss}"
                - get
                - ".work_items[] | select(.id == \"{unit.id}\") | .pr_url"
              test: url
        park_on:
          - file: "{run.dir}/out/{unit.id}/correction.txt"
            reason: "the close gate for {unit.id} is red and needs a correction: fix it, then answer with `pulse-factory answer`; `pulse-factory clear` resumes only after the correction packet is moved away"
            # The answer retires the packet, so the resumed stage does not park on it again. The
            # packet text goes into the rulings file, which the close brief tells the seat to read.
            on_answer:
              - - sh
                - "{run.package}/scripts/rule.sh"
                - "{run.dir}/out/{unit.id}/rulings.md"
                - "{run.dir}/out/{unit.id}/correction.txt"
                - "{answer.file}"
                - "{answer.request}"
                - "{answer.generation}"
                - close

      # The reviewer reads the item PR at its head and writes `review.md`. The verdict is line 1 of
      # that file and nothing else counts: `scripts/verdict.sh` reads it for `done` and for the block
      # outcome. A block sends the unit to `fix`; a pass whose head is not the PR's head sends it to
      # `review` again. A pass on the PR head ends the stage, and the merge rule takes over. Each
      # loop is capped at 2.
      - name: review
        role: reviewer
        brief: [briefs/common.md, briefs/review.md]
        # The forge has no placeholder for the PR URL, so the message names the repo and the branch.
        message: >-
          /review {param.forge_repo} {unit.vars.branch}
          previous: {run.dir}/out/{unit.id}/review-prev.md
          Read {param.briefs}/common.md, then {param.briefs}/review.md, and follow them.
          Work item: {unit.id}. Worktree: {unit.vars.worktree_path}. Branch: {unit.vars.branch}.
          Forge repo: {param.forge_repo}.
          OUT: {run.dir}/out/{unit.id}. Review file: {run.dir}/out/{unit.id}/review.md.
          Stop file: {run.dir}/out/{unit.id}/stop.
          Rulings: {run.dir}/out/{unit.id}/rulings.md.
          Decisions file: {run.dir}/out/{unit.id}/decisions.md.
        cwd: "{unit.vars.worktree_path}"
        slots: [session]
        # `review-prep.sh` keeps the last well-formed review as `review-prev.md`, then clears `review.md`.
        before:
          - [mkdir, -p, "{run.dir}/out/{unit.id}"]
          - - sh
            - "{run.package}/scripts/review-prep.sh"
            - "{run.dir}/out/{unit.id}/review.md"
            - "{run.dir}/out/{unit.id}/review-prev.md"
        stop_file:
          file: "{run.dir}/out/{unit.id}/stop"
          on_answer:
            - - sh
              - "{run.package}/scripts/rule.sh"
              - "{run.dir}/out/{unit.id}/rulings.md"
              - "{run.dir}/out/{unit.id}/stop"
              - "{answer.file}"
              - "{answer.request}"
              - "{answer.generation}"
              - review
        stall_minutes: 20
        first_turn_seconds: 180
        # No `worktree` setting: the reviewer has no worktree write. It reads the worktree through `cwd`.
        settings:
          env.SPINE_STOP_FILE: "{run.dir}/out/{unit.id}/stop"
          env.SPINE_DECISIONS: "{run.dir}/out/{unit.id}/decisions.md"
          report_dir: "{run.dir}/out/{unit.id}"
          decisions_file: "{run.dir}/out/{unit.id}/decisions.md"
        done:
          - exit0:
              - sh
              - "{run.package}/scripts/verdict.sh"
              - "{run.dir}/out/{unit.id}/review.md"
              - any
        outcomes:
          - when:
              - exit0:
                  - sh
                  - "{run.package}/scripts/verdict.sh"
                  - "{run.dir}/out/{unit.id}/review.md"
                  - block
            to: fix
            max: 2
          - when:
              - exit0:
                  - sh
                  - "{run.package}/scripts/stale-pass.sh"
                  - "{run.dir}/out/{unit.id}/review.md"
                  - "{param.forge_repo}"
                  - "{unit.vars.branch}"
            to: review
            max: 2

      # The fixer runs only when a review blocks. It fixes the blocking findings, pushes once, and
      # sends the unit back to `review`.
      - name: fix
        role: close
        entered_by: outcome
        brief: [briefs/common.md, briefs/fix.md]
        message: >-
          Read {param.briefs}/common.md, then {param.briefs}/fix.md, and follow them.
          Work item: {unit.id}. Handoff: {unit.vars.handoff_path}.
          Worktree: {unit.vars.worktree_path}. Branch: {unit.vars.branch}.
          Review file: {run.dir}/out/{unit.id}/review.md.
          Fix done file: {run.dir}/out/{unit.id}/fix-done.
          OUT: {run.dir}/out/{unit.id}. Stop file: {run.dir}/out/{unit.id}/stop.
          Rulings: {run.dir}/out/{unit.id}/rulings.md.
          Decisions file: {run.dir}/out/{unit.id}/decisions.md.
        cwd: "{unit.vars.worktree_path}"
        slots: [session, build]
        before:
          - [mkdir, -p, "{run.dir}/out/{unit.id}"]
          - [rm, -f, "{run.dir}/out/{unit.id}/fix-done"]
        stop_file:
          file: "{run.dir}/out/{unit.id}/stop"
          on_answer:
            - - sh
              - "{run.package}/scripts/rule.sh"
              - "{run.dir}/out/{unit.id}/rulings.md"
              - "{run.dir}/out/{unit.id}/stop"
              - "{answer.file}"
              - "{answer.request}"
              - "{answer.generation}"
              - fix
        stall_minutes: 20
        first_turn_seconds: 180
        settings:
          env.SPINE_STOP_FILE: "{run.dir}/out/{unit.id}/stop"
          env.SPINE_DECISIONS: "{run.dir}/out/{unit.id}/decisions.md"
          push_dir: "{unit.vars.worktree_path}"
          push_branch: "{unit.vars.branch}"
          report_dir: "{param.spine_dir}/work-{unit.id}"
          worktree: "{unit.vars.worktree_path}"
          own_branch: "{unit.vars.branch}"
          decisions_file: "{run.dir}/out/{unit.id}/decisions.md"
        done:
          - file: "{run.dir}/out/{unit.id}/fix-done"
        outcomes:
          - when:
              - file: "{run.dir}/out/{unit.id}/fix-done"
            to: review
            max: 2

    merge:
      rule: green_checks_in_declared_order
      repo: "{param.forge_repo}"
      base: "{param.spine_branch}"
      pr:
        - env
        - -C
        - "{param.method_root}"
        - "{param.oss}"
        - get
        - ".work_items[] | select(.id == \"{unit.id}\") | .pr_url"
      head_check: true
      after_merge:
        - [git, -C, "{param.repo}", fetch, origin, "{param.spine_branch}"]
        - [git, -C, "{param.repo}", merge, --ff-only, "origin/{param.spine_branch}"]
        - [env, -C, "{param.method_root}", "{param.oss}", work_item_status, "{unit.id}", complete]

  # The spine close. The seat runs the first pass of the method's spine close, which pushes the
  # spine branch and opens the spine PR. It never merges, reviews or runs the second pass. The
  # controller then opens a `merge_ack` request for the PR and merges it only on the claim's ack.
  spine:
    stages:
      - name: spine_close
        role: close
        brief: [briefs/common.md, briefs/spine-close.md]
        message: >-
          Read {param.briefs}/common.md, then {param.briefs}/spine-close.md, and follow them.
          Spine: {param.spine}. Base branch: {param.base_branch}. Spine branch: {param.spine_branch}.
          OUT: {run.dir}/out/{unit.id}. Stop file: {run.dir}/out/{unit.id}/stop.
          Rulings: {run.dir}/out/{unit.id}/rulings.md.
          Decisions file: {run.dir}/out/{unit.id}/decisions.md.
        cwd: "{param.method_root}"
        slots: [session]
        before:
          - [mkdir, -p, "{run.dir}/out/{unit.id}"]
        stop_file:
          file: "{run.dir}/out/{unit.id}/stop"
          on_answer:
            - - sh
              - "{run.package}/scripts/rule.sh"
              - "{run.dir}/out/{unit.id}/rulings.md"
              - "{run.dir}/out/{unit.id}/stop"
              - "{answer.file}"
              - "{answer.request}"
              - "{answer.generation}"
              - spine_close
        stall_minutes: 30
        first_turn_seconds: 180
        skills: [close]
        settings:
          env.SPINE_STOP_FILE: "{run.dir}/out/{unit.id}/stop"
          env.SPINE_DECISIONS: "{run.dir}/out/{unit.id}/decisions.md"
          push_dir: "{param.repo}"
          push_branch: "{param.spine_branch}"
          own_branch: "{param.spine_branch}"
          report_dir: "{param.spine_dir}"
          decisions_file: "{run.dir}/out/{unit.id}/decisions.md"
        # The stage is done when the forge lists an open PR from the spine branch into the base.
        done:
          - pr:
              argv:
                - gh
                - pr
                - list
                - --repo
                - "{param.forge_repo}"
                - --head
                - "{param.spine_branch}"
                - --base
                - "{param.base_branch}"
                - --state
                - open
                - --json
                - url
                - --jq
                - '.[0].url // ""'
              test: url

    merge:
      rule: claim_ack
      repo: "{param.forge_repo}"
      base: "{param.base_branch}"
      head_branch: "{param.spine_branch}"
      pr:
        - gh
        - pr
        - list
        - --repo
        - "{param.forge_repo}"
        - --head
        - "{param.spine_branch}"
        - --base
        - "{param.base_branch}"
        - --state
        - open
        - --json
        - url
        - --jq
        - '.[0].url // ""'
      # The claim's ack pins the head SHA, so the head check would only refuse an operator's fix
      # commit on the PR.
      head_check: false
      after_merge:
        - [git, -C, "{param.repo}", fetch, origin, "{param.base_branch}"]

# The run ends when the method records the spine as closed. That is the second pass of the close,
# which the operator runs in the claim session after the spine PR is merged.
end_when:
  when:
    - exit0:
        - jq
        - -e
        - --arg
        - s
        - "{param.spine}"
        - 'any(.spines[]; .id == $s and .status == "closed")'
        - "{param.state_file}"
  waiting: "the spine PR is merged: run /ossify:close {param.spine} in the claim session for the second pass"
  reason: "spine {param.spine} closed"
