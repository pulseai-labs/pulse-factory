name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain comes from rust-toolchain.toml. This step installs it when the runner lacks it.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      # The binary run standalone: a dry arm with no model and no spend. `community-edition.sh` (d14)
      # looks for this step by its name.
      - name: Smoke
        run: |
          cargo build --locked -p pulse-factory
          PF_BIN=target/debug/pulse-factory scripts/demo/arm-dry-run.sh
