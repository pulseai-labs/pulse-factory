[package]
name = "pulse-factory"
description = "The pulse-factory binary: the CLI verbs, the controller and the hook."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "pulse_factory"
path = "src/lib.rs"

[[bin]]
name = "pulse-factory"
path = "src/main.rs"

# A small client of the chat stream for the demo and the tests (`r1.s3.w3`): a shell has no pinned
# WSS client on every runner. w4's `pf-client` stream may replace it later.
[[bin]]
name = "pf-stream-reader"
path = "src/bin/pf-stream-reader.rs"

[dependencies]
pf-adapter-claude = { path = "../pf-adapter-claude" }
pf-adapter-fake = { path = "../pf-adapter-fake" }
pf-adapter-omp = { path = "../pf-adapter-omp" }
pf-api = { path = "../pf-api" }
# The stream reader takes its pinned TLS config from pf-client; the `pulse-factory` binary itself
# does not link it.
pf-client = { path = "../pf-client" }
pf-engine = { path = "../pf-engine" }
pf-forge-bare = { path = "../pf-forge-bare" }
pf-forge-github = { path = "../pf-forge-github" }
pf-ipc = { path = "../pf-ipc" }
pf-rules = { path = "../pf-rules" }
pf-store-sqlite = { path = "../pf-store-sqlite" }
pf-workflow = { path = "../pf-workflow" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "net", "io-util", "time", "macros", "sync", "signal"] }
tokio-tungstenite.workspace = true
rustls.workspace = true

[dev-dependencies]
proptest.workspace = true
rusqlite.workspace = true
tempfile.workspace = true
