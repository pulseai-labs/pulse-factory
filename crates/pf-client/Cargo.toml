[package]
name = "pf-client"
description = "The pinned client of the network API (ADR-0012): the TLS call with the key pinned at pairing, the device store, the transport of the UI and the test bridge."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "pf_client"
path = "src/lib.rs"

[[bin]]
name = "pf-client-bridge"
path = "src/bin/pf-client-bridge.rs"

[dependencies]
pf-api = { path = "../pf-api" }
pf-engine = { path = "../pf-engine" }
serde.workspace = true
serde_json.workspace = true
axum.workspace = true
hyper = { workspace = true, features = ["client"] }
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time", "sync", "io-util", "macros"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true

# The Keychain is on the Mac only. The Linux build and its tests never compile this crate.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true

[dev-dependencies]
pf-ipc = { path = "../pf-ipc" }
rcgen.workspace = true
# TLS 1.2 is compiled in for the tests only, so a test server can offer it and show the client refuse it
rustls = { workspace = true, features = ["tls12"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
