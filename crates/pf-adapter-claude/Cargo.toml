[package]
name = "pf-adapter-claude"
description = "The Claude Code chat adapter behind the chat port: a managed, pinned CLI driven headless over stream-json."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pf-claude-replay"
path = "src/bin/pf-claude-replay.rs"

[dependencies]
pf-engine = { path = "../pf-engine" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
pf-adapter-fake = { path = "../pf-adapter-fake" }
tempfile.workspace = true
