# The paper workflow of the stranded-close demo (`stranded-close.sh`): one round, one item, on a bare
# forge that holds the spine branch (the controller's base push puts it there). It runs the
# `no_signal` key of the shipped `workflows/ossify-spine` close stage: one nudge, then `stranded.sh`.
# The demo copies the shipped `scripts/stranded.sh` and `scripts/rule.sh` into this package's
# `scripts/` before it arms, so the run uses the real scripts. The paper close seat plays a model:
# with `mode=nudged` it ends its first turn with no PR and opens the PR after the nudge; with
# `mode=stranded` it stages two files and ends twice, and it opens the PR only after a ruling.
# Nothing here reaches a model, a network or a real forge.
version: 1
name: paper-stranded-close

# What `arm` must supply.
#   spine         the spine ID (arm sets it)
#   spine_branch  the branch the item PRs merge into; it exists in `repo` and not on the forge
#   spine_dir     the directory that holds the reports
#   worktree_root the directory that holds the item worktrees
#   repo          the local repository that holds the spine branch
#   forge_repo    the bare repo; `arm --paper` sets it to <paper>/forge.git
#   briefs        the run's own copy of the briefs (arm sets it)
#   mode          `nudged` (the seat finishes after the nudge) or `stranded` (the seat ends twice)
params: [spine, spine_branch, spine_dir, worktree_root, repo, forge_repo, briefs, mode]

roles:
  lane:
    runtime: paper
    model: paper/lane
    rules: rules/lane.yaml
  implementer:
    runtime: paper
    model: paper/implementer
    rules: rules/implementer.yaml
  verifier:
    runtime: paper
    model: paper/verifier
    rules: rules/verifier.yaml
  close:
    runtime: paper
    model: paper/close
    rules: rules/close.yaml

settings:
  model_sessions: 2
  cold_builds: 1

plan_check: [echo, "1"]

roots: ["{param.worktree_root}"]

unit_sources:
  - dir: "{run.dir}/queue"
    track: item
    vars: [worktree_path, branch, base_sha]

seeds:
  - id: lane
    group: lane
    order: 1
    track: lane
    vars: {}
    repeat:
      when_units_done: item
      until_file: "{run.dir}/rounds.done"
      max: 1

tracks:
  lane:
    stages:
      - name: lane
        role: lane
        brief: [briefs/common.md]
        message: "Paper lane for {param.spine}."
        cwd: "{param.spine_dir}"
        before:
          - [mkdir, -p, "{run.dir}/out/{unit.id}"]
        stop_file: "{run.dir}/out/{unit.id}/stop"
        stall_minutes: 5
        first_turn_seconds: 30
        settings:
          env.PAPER_FORGE: "{param.forge_repo}"
          env.PAPER_LANE_DONE: "{run.dir}/out/{unit.id}/lane.done"
          env.PAPER_QUEUE: "{run.dir}/queue"
          env.PAPER_REPO: "{param.repo}"
          env.PAPER_RUN_DIR: "{run.dir}"
          env.PAPER_SPINE_BRANCH: "{param.spine_branch}"
          env.PAPER_WORKTREE_ROOT: "{param.worktree_root}"
          report_dir: "{param.spine_dir}"
        done:
          - file: "{run.dir}/out/{unit.id}/lane.done"

  item:
    stages:
      - name: implement
        role: implementer
        brief: [briefs/common.md]
        message: "Paper implement for {unit.id}."
        cwd: "{unit.vars.worktree_path}"
        slots: [session, build]
        before:
          - [mkdir, -p, "{run.dir}/out/{unit.id}"]
        stop_file: "{run.dir}/out/{unit.id}/stop"
        stall_minutes: 5
        first_turn_seconds: 30
        settings:
          env.PAPER_UNIT: "{unit.id}"
          env.PAPER_REPORT_DIR: "{param.spine_dir}/work-{unit.id}"
          report_dir: "{param.spine_dir}/work-{unit.id}"
          worktree: "{unit.vars.worktree_path}"
          own_branch: "{unit.vars.branch}"
        done:
          - file: "{param.spine_dir}/work-{unit.id}/report.md"

      - name: verify
        role: verifier
        brief: [briefs/common.md]
        message: "Paper verify for {unit.id}."
        cwd: "{unit.vars.worktree_path}"
        slots: [session, build]
        before:
          - [mkdir, -p, "{run.dir}/out/{unit.id}"]
        stop_file: "{run.dir}/out/{unit.id}/stop"
        stall_minutes: 5
        first_turn_seconds: 30
        settings:
          env.PAPER_UNIT: "{unit.id}"
          env.PAPER_VERDICT: "{run.dir}/out/{unit.id}/verdict.json"
          report_dir: "{param.spine_dir}/work-{unit.id}"
          worktree: "{unit.vars.worktree_path}"
          own_branch: "{unit.vars.branch}"
        done:
          - file: "{run.dir}/out/{unit.id}/verdict.json"

      - name: close
        role: close
        brief: [briefs/common.md]
        message: "Paper close for {unit.id}."
        cwd: "{unit.vars.worktree_path}"
        slots: [session]
        # The close seat's own branch is the work branch, so it may not push the spine branch. The
        # controller does, before this stage launches, when the forge lacks the branch.
        base_push:
          dir: "{param.repo}"
          branch: "{param.spine_branch}"
        before:
          - [mkdir, -p, "{run.dir}/out/{unit.id}"]
        stop_file:
          file: "{run.dir}/out/{unit.id}/stop"
          on_answer:
            - - sh
              - "{run.package}/scripts/rule.sh"
              - "{run.dir}/out/{unit.id}/rulings.md"
              - "{run.dir}/out/{unit.id}/stop"
              - "{answer.file}"
              - "{answer.request}"
              - "{answer.generation}"
              - close
        # The close stage of `workflows/ossify-spine`, as it is shipped: one nudge, then the
        # stranded check, which writes the stop file.
        no_signal:
          nudge: >-
            You ended your turn, but {unit.id} is not finished. Close ends only when the item PR is
            open, or when you wrote the stop file {run.dir}/out/{unit.id}/stop. Do one of the two
            now, then end your turn.
          nudges: 1
          run:
            - - sh
              - "{run.package}/scripts/stranded.sh"
              - "{unit.vars.worktree_path}"
              - "{unit.vars.branch}"
              - "{unit.vars.base_sha}"
              - "{unit.id}"
              - "{run.dir}/out/{unit.id}/stop"
        stall_minutes: 5
        first_turn_seconds: 30
        settings:
          env.PAPER_FORGE: "{param.forge_repo}"
          env.PAPER_UNIT: "{unit.id}"
          env.PAPER_BRANCH: "{unit.vars.branch}"
          env.PAPER_BASE: "{param.spine_branch}"
          env.PAPER_PR_URL: "{run.dir}/out/{unit.id}/pr.url"
          env.PAPER_STOP: "{run.dir}/out/{unit.id}/stop"
          env.PAPER_MODE: "{param.mode}"
          env.PAPER_LOG: "{run.dir}/out/{unit.id}/close.log"
          env.PAPER_RULINGS: "{run.dir}/out/{unit.id}/rulings.md"
          push_dir: "{unit.vars.worktree_path}"
          push_branch: "{unit.vars.branch}"
          report_dir: "{param.spine_dir}/work-{unit.id}"
          worktree: "{unit.vars.worktree_path}"
          own_branch: "{unit.vars.branch}"
        done:
          - pr:
              argv: [cat, "{run.dir}/out/{unit.id}/pr.url"]
              test: url

    merge:
      rule: green_checks_in_declared_order
      repo: "{param.forge_repo}"
      base: "{param.spine_branch}"
      pr: [cat, "{run.dir}/out/{unit.id}/pr.url"]
      head_check: true
      after_merge:
        - [sh, -c, "echo {unit.id} >> {run.dir}/after_merge.log"]
